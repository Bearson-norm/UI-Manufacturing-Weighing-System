name: Deploy Production Dashboard

on:
  push:
    branches:
      - KMI-Production
  workflow_dispatch: # Allow manual trigger

env:
  NODE_VERSION: '18.x'
  # PostgreSQL Database Configuration
  # Note: For GitHub Actions service container, use 'postgres' as default user
  # For VPS/production, use 'admin' user
  DB_HOST: ${{ secrets.DB_HOST || 'localhost' }}
  DB_PORT: ${{ secrets.DB_PORT || '5432' }}
  DB_NAME: ${{ secrets.DB_NAME || 'kmi_manufacturing_db' }}
  DB_USER: ${{ secrets.DB_USER || 'postgres' }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD || 'postgres' }}
  NODE_ENV: production
  # VPS Deployment Configuration
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER || 'root' }}
  VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
  VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH || '/var/www/manufacturing-dashboard' }}

jobs:
  deploy:
    name: Deploy Dashboard to Production
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ${{ env.DB_NAME }}
          POSTGRES_USER: ${{ env.DB_USER }}
          POSTGRES_PASSWORD: ${{ env.DB_PASSWORD }}
          TZ: Asia/Bangkok
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: KMI-Production

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        working-directory: ./client
        run: npm ci

      - name: Wait for PostgreSQL to be ready
        run: |
          echo "⏳ Waiting for PostgreSQL database to be ready..."
          node -e "
          const { Pool } = require('pg');
          const pool = new Pool({
            host: process.env.DB_HOST,
            port: process.env.DB_PORT,
            user: process.env.DB_USER,
            password: process.env.DB_PASSWORD,
            database: 'postgres', // Connect to default PostgreSQL database first
            connectionTimeoutMillis: 5000
          });
          let retries = 30;
          const checkConnection = async () => {
            try {
              const result = await pool.query('SELECT version()');
              const pgVersion = result.rows[0].version;
              console.log('✅ PostgreSQL is ready!');
              console.log('📊 PostgreSQL Version:', pgVersion.split(',')[0]);
              await pool.end();
              process.exit(0);
            } catch (err) {
              retries--;
              if (retries <= 0) {
                console.error('❌ PostgreSQL connection failed after 30 retries');
                console.error('Error:', err.message);
                process.exit(1);
              }
              console.log('Waiting for PostgreSQL to be ready... (' + retries + ' retries left)');
              setTimeout(checkConnection, 2000);
            }
          };
          checkConnection();
          "
        env:
          DB_HOST: ${{ env.DB_HOST }}
          DB_PORT: ${{ env.DB_PORT }}
          DB_USER: ${{ env.DB_USER }}
          DB_PASSWORD: ${{ env.DB_PASSWORD }}

      - name: Setup environment variables
        run: |
          echo "DB_HOST=${{ env.DB_HOST }}" >> $GITHUB_ENV
          echo "DB_PORT=${{ env.DB_PORT }}" >> $GITHUB_ENV
          echo "DB_NAME=${{ env.DB_NAME }}" >> $GITHUB_ENV
          echo "DB_USER=${{ env.DB_USER }}" >> $GITHUB_ENV
          echo "DB_PASSWORD=${{ env.DB_PASSWORD }}" >> $GITHUB_ENV
          echo "NODE_ENV=${{ env.NODE_ENV }}" >> $GITHUB_ENV
          echo "PORT=6657" >> $GITHUB_ENV
          echo "JWT_SECRET=github_actions_secret_key" >> $GITHUB_ENV
          echo "CORS_ORIGIN=https://kmi-mows.moof-set.web.id" >> $GITHUB_ENV

      - name: Run PostgreSQL database migration
        run: |
          echo "🔄 Running PostgreSQL database migration..."
          npm run db:migrate
        env:
          DB_HOST: ${{ env.DB_HOST }}
          DB_PORT: ${{ env.DB_PORT }}
          DB_NAME: ${{ env.DB_NAME }}
          DB_USER: ${{ env.DB_USER }}
          DB_PASSWORD: ${{ env.DB_PASSWORD }}

      - name: Verify PostgreSQL database connection
        run: |
          echo "🔍 Verifying PostgreSQL database connection..."
          node -e "
          const { Pool } = require('pg');
          const pool = new Pool({
            host: process.env.DB_HOST,
            port: process.env.DB_PORT,
            database: process.env.DB_NAME,
            user: process.env.DB_USER,
            password: process.env.DB_PASSWORD
          });
          pool.query('SELECT NOW(), current_database(), version()', (err, res) => {
            if (err) {
              console.error('❌ PostgreSQL connection failed:', err.message);
              process.exit(1);
            }
            console.log('✅ PostgreSQL connection successful!');
            console.log('📅 Current time:', res.rows[0].now);
            console.log('📊 Database name:', res.rows[0].current_database);
            console.log('🔧 PostgreSQL version:', res.rows[0].version.split(',')[0]);
            pool.end();
            process.exit(0);
          });
          "
        env:
          DB_HOST: ${{ env.DB_HOST }}
          DB_PORT: ${{ env.DB_PORT }}
          DB_NAME: ${{ env.DB_NAME }}
          DB_USER: ${{ env.DB_USER }}
          DB_PASSWORD: ${{ env.DB_PASSWORD }}

      - name: Verify PostgreSQL database schema
        run: |
          echo "🔍 Verifying PostgreSQL database schema..."
          node -e "
          const { Pool } = require('pg');
          const pool = new Pool({
            host: process.env.DB_HOST,
            port: process.env.DB_PORT,
            database: process.env.DB_NAME,
            user: process.env.DB_USER,
            password: process.env.DB_PASSWORD
          });
          pool.query(\"SELECT table_name FROM information_schema.tables WHERE table_schema = 'public' ORDER BY table_name\", (err, res) => {
            if (err) {
              console.error('❌ PostgreSQL schema verification failed:', err.message);
              process.exit(1);
            }
            console.log('✅ PostgreSQL database tables created:');
            if (res.rows.length === 0) {
              console.log('⚠️  No tables found in database');
            } else {
              res.rows.forEach(row => console.log('  ✓', row.table_name));
            }
            console.log('📊 Total tables:', res.rows.length);
            pool.end();
            process.exit(0);
          });
          "
        env:
          DB_HOST: ${{ env.DB_HOST }}
          DB_PORT: ${{ env.DB_PORT }}
          DB_NAME: ${{ env.DB_NAME }}
          DB_USER: ${{ env.DB_USER }}
          DB_PASSWORD: ${{ env.DB_PASSWORD }}

      - name: Build frontend
        working-directory: ./client
        run: npm run build
        env:
          REACT_APP_API_URL: http://localhost:6657/api
          NODE_ENV: production

      - name: Start server and test health endpoint
        run: |
          # Start server in background
          npm start &
          SERVER_PID=$!
          
          # Wait for server to start
          echo "Waiting for server to start..."
          sleep 10
          
          # Test health endpoint
          curl -f http://localhost:6657/health || exit 1
          echo "✅ Health check passed"
          
          # Stop server
          kill $SERVER_PID || true
        env:
          DB_HOST: ${{ env.DB_HOST }}
          DB_PORT: ${{ env.DB_PORT }}
          DB_NAME: ${{ env.DB_NAME }}
          DB_USER: ${{ env.DB_USER }}
          DB_PASSWORD: ${{ env.DB_PASSWORD }}
          NODE_ENV: ${{ env.NODE_ENV }}
          PORT: 6657
          JWT_SECRET: github_actions_secret_key
          CORS_ORIGIN: https://kmi-mows.moof-set.web.id

      - name: Deploy to VPS
        if: env.VPS_HOST != ''
        uses: appleboy/scp-action@master
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          port: ${{ env.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "."
          target: ${{ env.VPS_DEPLOY_PATH }}
          strip_components: 0
          exclude: |
            node_modules
            client/node_modules
            .git
            .github
            *.log
            .env
            .env.local

      - name: Setup and restart on VPS
        if: env.VPS_HOST != ''
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          port: ${{ env.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ env.VPS_DEPLOY_PATH }}
            
            # Setup timezone
            export TZ=Asia/Bangkok
            sudo timedatectl set-timezone Asia/Bangkok || true
            
            # Setup environment file
            cat > .env << EOF
            TZ=Asia/Bangkok
            DB_HOST=${{ env.DB_HOST }}
            DB_PORT=${{ env.DB_PORT }}
            DB_NAME=${{ env.DB_NAME }}
            DB_USER=${{ env.DB_USER }}
            DB_PASSWORD=${{ env.DB_PASSWORD }}
            NODE_ENV=production
            PORT=6657
            JWT_SECRET=${{ secrets.JWT_SECRET || 'your_super_secret_jwt_key_here' }}
            CORS_ORIGIN=${{ secrets.CORS_ORIGIN || 'https://kmi-mows.moof-set.web.id' }}
            EOF
            
            # Install dependencies if needed
            if [ ! -d "node_modules" ]; then
              echo "Installing root dependencies..."
              npm ci --production
            fi
            
            if [ ! -d "client/node_modules" ]; then
              echo "Installing client dependencies..."
              cd client
              npm ci --production
              cd ..
            fi
            
            # Run database migration
            echo "Running database migration..."
            npm run db:migrate || echo "Migration skipped or already done"
            
            # Build frontend if needed
            if [ ! -d "client/build" ]; then
              echo "Building frontend..."
              cd client
              npm run build
              cd ..
            fi
            
            # Setup Nginx configuration
            if command -v nginx &> /dev/null; then
              echo "Setting up Nginx configuration..."
              sudo cp nginx/kmi-mows.moof-set.web.id.conf /etc/nginx/sites-available/kmi-mows.moof-set.web.id.conf
              sudo ln -sf /etc/nginx/sites-available/kmi-mows.moof-set.web.id.conf /etc/nginx/sites-enabled/
              
              # Remove default nginx site if exists
              sudo rm -f /etc/nginx/sites-enabled/default
              
              # Test nginx configuration
              sudo nginx -t && sudo systemctl reload nginx || echo "Nginx configuration test failed"
            else
              echo "Nginx not found. Please install and configure manually."
            fi
            
            # Restart application using PM2 (if installed)
            if command -v pm2 &> /dev/null; then
              echo "Restarting application with PM2..."
              pm2 restart manufacturing-dashboard || pm2 start server/index.js --name manufacturing-dashboard --update-env
            else
              echo "PM2 not found. Please restart application manually."
            fi
            
            echo "✅ Deployment completed on VPS!"

      - name: Deployment summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: KMI-Production" >> $GITHUB_STEP_SUMMARY
          echo "- **Database**: PostgreSQL 15 Alpine (migrated)" >> $GITHUB_STEP_SUMMARY
          echo "- **Database User**: ${{ env.DB_USER }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend**: Built successfully" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend**: Health check passed" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ env.VPS_HOST }}" ]; then
            echo "- **VPS Deployment**: Completed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: Production" >> $GITHUB_STEP_SUMMARY
          echo "- **Node Version**: ${{ env.NODE_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Database Type**: PostgreSQL" >> $GITHUB_STEP_SUMMARY
          echo "- **Database**: ${{ env.DB_NAME }}@${{ env.DB_HOST }}:${{ env.DB_PORT }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Database User**: ${{ env.DB_USER }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ env.VPS_HOST }}" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🖥️ VPS Configuration" >> $GITHUB_STEP_SUMMARY
            echo "- **VPS Host**: ${{ env.VPS_HOST }}" >> $GITHUB_STEP_SUMMARY
            echo "- **VPS User**: ${{ env.VPS_USER }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Deploy Path**: ${{ env.VPS_DEPLOY_PATH }}" >> $GITHUB_STEP_SUMMARY
          fi
